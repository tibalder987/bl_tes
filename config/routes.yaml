home_redirect:
  path: /
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
  defaults:
    route: app_home_page
    permanent: false
    _locale: "fr"

controllers:
  resource:
    path: ../src/Controller/
    namespace: App\Controller
  type: attribute
  prefix: /{_locale}
  requirements:
    _locale: "%app_locales%"
  defaults:
    _locale: "%locale%"

# API routes without locale prefix
api_files:
  resource:
    path: ../src/Controller/Api/
    namespace: App\Controller\Api
  type: attribute
