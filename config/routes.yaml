controllers:
  resource:
    path: ../src/Controller/
    namespace: App\Controller
  type: attribute
  prefix: /{_locale}
  requirements:
    _locale: "%app_locales%"
  defaults:
    _locale: "%locale%"

# API routes without locale prefix
api_files:
  resource:
    path: ../src/Controller/Api/
    namespace: App\Controller\Api
  type: attribute
