# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  locale: "fr"
  app_locales: fr|en
  absolute_url: "%env(ABSOLUTE_URL)%"

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"

  #EventListener - Configuration
  App\EventListener\ConfigurationListener:
    tags:
      - { name: kernel.event_listener, event: kernel.request }
  #EventListener - Maintenance
  App\EventListener\MaintenanceListener:
    tags:
      - { name: kernel.event_listener, event: kernel.request }
  #EventListener - Logout
  App\EventListener\LogoutListener:
    tags:
      - name: "kernel.event_listener"
        event: 'Symfony\Component\Security\Http\Event\LogoutEvent'
        dispatcher: security.event_dispatcher.main
  #EventListener - User Enabled/Disabled user
  App\EventListener\UserListener:
    tags:
      - { name: doctrine.event_listener, event: postUpdate }
  #EventListener - UserAdmin passwordExpired
  App\EventListener\UserPasswordExpireListener:
    tags:
      - { name: kernel.event_listener, event: kernel.request }

  #EventListener - URL Path
  App\EventListener\PageTranslationListener:
    tags:
      - {
          name: doctrine.orm.entity_listener,
          event: prePersist,
          entity: 'App\Entity\PageTranslation',
        }
  App\EventListener\ArticleTranslationListener:
    tags:
      - {
          name: doctrine.orm.entity_listener,
          event: prePersist,
          entity: 'App\Entity\ArticleTranslation',
        }

  # our custom login rate limiter
  app.login_rate_limiter:
    class: Symfony\Component\Security\Http\RateLimiter\DefaultLoginRateLimiter
    arguments:
      # globalFactory is the limiter for IP
      $globalFactory: "@limiter.ip_login"
      # localFactory is the limiter for username+IP
      $localFactory: "@limiter.username_ip_login"
      $secret: "%kernel.secret%"

  # File Manager Services
  App\Service\FileStorageService:
    arguments:
      $projectDir: "%kernel.project_dir%"

  # Alias explicite pour autowire ReCaptcha dans les contrôleurs/services
  ReCaptcha\ReCaptcha: "@karser_recaptcha3.google.recaptcha"
