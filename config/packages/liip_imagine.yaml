# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    # valid drivers options include "gd" or "gmagick" or "imagick"
    driver: "gd"
    filter_sets:
        original: ~
        home_news:
            quality: 100
            filters:
                thumbnail: { size: [ 712, 788 ], mode: outbound }
        home_slider:
            quality: 100
            filters:
                thumbnail: { size: [ 1500, 917 ], mode: inset }
        list_news:
            quality: 100
            filters:
                thumbnail: { size: [ 712, 472 ], mode: outbound }
        list_news2:
            quality: 100
            filters:
                thumbnail: { size: [ 780, 492 ], mode: outbound }
        list_news3:
            quality: 100
            filters:
                thumbnail: { size: [ 780, 780 ], mode: outbound }
        image_video:
            quality: 100
            filters:
                thumbnail: { size: [ 712, 400 ], mode: outbound }
        detail_news:
            quality: 100
            filters:
                thumbnail: { size: [ 1500, 636 ], mode: outbound }
        list_media:
            quality: 100
            filters:
                thumbnail: { size: [ 516, 315 ], mode: outbound }
