s5.btn: Your Table Awaits
s5.p1: Above the water, at Povai Bay Bistro, French cuisine meets the islands flavors and colors with elegance and creativity.
s5.p2: Nearby, the Tiki Tide Bar becomes the place to meet and get conversations started as the day unfolds.
s5.p3: "Just a 5-minute ride away - with a complimentary shuttle - <b>La Bella Matira restaurant</b> brings another perspective - each meal enhanced with views of Bora Bora's most celebrated shoreline."
s5.sub: Three restaurants and bars - <br>to make each day a new <span>flow</span> amidst <br>Bora Bora's gentle <span class="shape">tides.</span>
