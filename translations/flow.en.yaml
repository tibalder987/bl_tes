s2.title: "Between <span>Land</span><br>& <span>Water</span>"
s2.p1: "Set along the edge of Bora Bora's lagoon, the Bloody Mary's Hotel sits <b>where earth and sea meet.</b>"
s2.p2: "A few steps take you from solid ground to the shoreline, and from shaded spaces to open horizon…"
s2.p3: So that nothing is ever
s2.shape: too far.
s3.p1: Along the lagoon, a small beach and the pool offer an easy place to pause - for unhurried mornings and deliciously sunny afternoons.
s3.p2: And when the day calls for a wider horizon and azure waters, Matira Beach - Bora Bora's main beach - is just a short drive away with our free shuttle.
s3.sub: Jump in and live Bora Bora<br><span class="shape">like the locals.</span>
