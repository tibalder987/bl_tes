s4.p1: "Food has always been <b>part of the story here.</b> The legendary Bloody Mary's Restaurant, a Bora Bora landmark <b>since 1979</b>, returns as the lively center of the Bloody Mary's Hotel."
s4.sub: 'A place where locals and travelers<br>can gather and rejoice in life''s<br><span class="shape">simple pleasures.</span>'
