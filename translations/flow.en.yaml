s1.p1: "Spaces shift with the light, the tide, and the pulse of the day."
s1.p2: "Paths open toward the lagoon. Terraces catch the changing sky.<br>Conversations travel from one corner to another."
s1.sub: Here, there is <span>no schedule</span> to follow.<br>Your days. <span class="shape">Your Bora Bora flow.</span>
