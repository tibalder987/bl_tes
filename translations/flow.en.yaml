hero.title: Room to Breathe.
hero.background: Elevated coastline with palms along the shore, turquoise lagoon, reef swell, and open ocean under a soft sky.
img.beach: Palm fronds framing a guest walking into clear shallow lagoon water off a white-sand tropical beach toward a verdant island.
img.boat: Aerial resort view of thatched overwater bungalows, long wooden pier with moored yachts and tenders, turquoise pool deck, and dense green hillside.
img.fitness: Close-up running shoes mid-stride on a treadmill overlooking lush tropical greenery through a glass wall.
img.group: Retro night scene at a seafood banquet on ice beneath a thatched roof, ornate fish display with hibiscus, woman holding lobster aloft beside guests.
img.restaurant: Shaded timber deck beside a twisting palm overlooking white beach, shimmering turquoise sea, and small boats offshore.
img.show: Lagoon lunch setup with submerged picnic bench, patterned cloth, banana-leaf fruit platters, wide orange umbrella, and iconic mountain backdrop.
img.sunset: Serene lagoon edge melting into pale beach sand beneath layered pastel clouds catching warm sunrise or sunset light, distant forested spur and boats on the reef.
img.table: Atmospheric sand-floor restaurant interior with sculpted wooden counter, log stools, peaked thatch ceiling, hanging woven lanterns and candlelit tables among tropical greenery.
img.water: Underwater view silhouetting two snorkellers holding hands beneath rippling turquoise water pierced by sunbeams.
img.welcome: Contemporary hotel lobby with light wood reception counter, warmly smiling host greeting a couple beside sculptural décor and monochrome accent chairs.
