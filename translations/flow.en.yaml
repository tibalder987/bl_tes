s6.fitness: Fitness
s6.p1: "The <b>fitness bungalow</b> offers a light-filled space to keep your routine in motion, whether to start the day or reset between activities."
s6.p2: "And for those drawn to the water, <b>kayaks</b> and <b>stand-up paddle boards</b> are available at <b>La Bella Matira</b>, making it easy to trade a workout indoors for one on the lagoon."
