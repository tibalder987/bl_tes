meta_description: "Dine by Bloody Mary's Hotel in Bora Bora: fluid spaces, island textures and a rhythm of stay between lagoon, sky and vibrant local life."
meta_keywords: "Bloody Mary's Hotel, Bora Bora, flow, boutique hotel, island hospitality, lagoon, French Polynesia, luxury stay"
