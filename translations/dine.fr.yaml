s1.p1: "Depuis <b>1979</b>, le mythique Bloody Mary's Restaurant est un lieu à la croisée des chemins à Bora Bora."
s1.p2: "Au fil des décennies, habitants, voyageurs et artistes s'y sont retrouvés autour de grandes tables, de poisson fraîchement pêché et de <b>soirées animées.</b>"
s1.p3: Aujourd'hui, cet esprit se prolonge au Bloody Mary's Hotel, où chaque espace devient une invitation à se retrouver, à s'attarder... et à savourer pleinement l'instant.
s1.sub: L'imaginaire s'éveille. Les vraies images
s1.sub_span: prennent vie bientôt.
s1.title: Le plaisir de
s1.title_span: Partager
s2.btn: Célébrer la Vie
s2.p1: "Sol de sable blanc, toit en pandanus, tables et bancs en bois, poisson et viandes fraîchement exposés."
s2.p2: "L'expérience reste fidèle à elle-même : simple, vivante et ouverte à tous."
s2.p3: "Vous choisissez votre grillade.<br>Notre Chef la prépare pour vous.<br>Et, sans s'en rendre compte, les verres se remplissent, les conversations s'animent... et tout se prolonge dans la nuit."
s2.title: Bloody Mary's Restaurant
s2.title_br: L'Original
s3.btn: On Vous Attend
s3.p1: Surplombant le lagon, Povai Bay insuffle un rythme plus léger, résolument contemporain.
s3.p2: "Le matin, le petit-déjeuner se savoure au fil de l'eau.<br>Le soir, les influences françaises rencontrent les produits de l'île, dans un esprit bistro."
s3.sub1: On vient pour ralentir.
s3.sub_span: On reste pour la vue.
s3.title: Povai Bay Bistro
s3.title_span: Sur l'Eau
s4.btn: Prendre Place
s4.p1: A quelques minutes de l'hôtel, avec une navette offerte, le restaurant La Bella Matira propose une autre façon de vivre l'esprit Bloody Mary's.
s4.p2: Installé le long de la plage de Matira, c'est un lieu pour les déjeuners baignés de lumière, les après-midis sans contrainte, les soirées al fresco… et ces moments passés tout près de l’eau.
s4.p3: Les saveurs méditerranéennes y rencontrent l'énergie de Bora Bora... fraîche, vibrante, à partager, quelque part entre la table et le lagon.
s4.title: La Bella Matira
s4.title_span: Horizons Lointains
s6.p1: "Le lieu idéal pour du snacking ou des tapas à partager... et des cocktails au caractère affirmé."
s6.p2: "Un endroit où le regard se transforme, porté par une lumière qui s'adoucit au fil de la journée."
s6.span1: Pour les Moments
s6.span2: de Pause
s6.title: Tiki Tide Bar
