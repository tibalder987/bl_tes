s2.title: "A Quelques <span>Pas</span><br> de <span>Tout</span>"
s2.p1: "Posé au bord du lagon de <b>Bora Bora,</b> le <b>Bloody Mary's Hotel</b> se trouve à la rencontre des éléments."
s2.p2: "Quelques pas suffisent pour passer de la terre à l'eau, de l'ombre à l'horizon ouvert…"
s2.p3: Rien n'est jamais
s2.shape: bien loin.
s3.p1: Au bord de l'eau, une plage discrète et la piscine offrent une parenthèse naturelle... pour des matins douceur et des après-midis baignés de soleil.
s3.p2: Et lorsque l’appel du large se fait sentir, rejoignez la plage de Matira, la plus emblématique de Bora Bora, en quelques minutes grâce à notre navette offerte.
s3.sub: Laissez-vous porter et vivez Bora Bora<br><span class="shape">comme les locaux.</span>
s3.sun: Soleil
s3.title: Sous le
s4.p1: "Ici, la cuisine a toujours fait <b>partie de l'histoire.</b>Le mythique Bloody Mary's Restaurant, véritable institution de Bora Bora <b>depuis 1979</b>, retrouve sa place au cœur du Bloody Mary's Hotel."
s4.sub: 'Un lieu vivant, où habitants et voyageurs <br>se retrouvent pour partager les <br><span class="shape">plaisirs simples.</span>'
s4.table: Table
s4.title_at: À
s5.btn: Réserver Ici
s5.p1: Au-dessus du lagon, Povai Bay, notre restaurant d'inspiration bistro, fait dialoguer cuisine française et saveurs de l'île avec élégance et créativité.
s5.p2: Tout proche, le Tiki Tide Bar devient le point de rendez-vous à la tombée du jour… là où les échanges naissent et se prolongent.
s5.p3: "Et à quelques minutes en navette offerte, <b>La Bella Matira</b> propose une autre perspective, où chaque repas se savoure face à l'une des plus belles plages de Bora Bora."
s5.sub: Trois restaurants et bars… <br>Pour laisser chaque journée suivre son <span>rythme</span>, <br>au fil des <span class="shape">marées</span> douces de Bora Bora.
s5.gentle: Bora Bora's gentle
s6.fitness: Mouvement
s6.p1: "Le <b>fitness bungalow</b> offre un espace baigné de lumière pour maintenir votre routine quotidienne...<br>Rester actif n'a jamais été aussi inspirant."
s6.p2: "Et pour ceux que le lagon appelle, <b>kayaks</b> et <b>stand-up paddle boards</b> vous attendent à <b>La Bella Matira.</b> <br>L'occasion parfaite d'échanger un workout en intérieur contre une séance sur l'eau."
