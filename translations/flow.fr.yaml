hero.background: Cocotiers le long du rivage face à un lagon turquoise, ligne du récif et grande bleue à l’horizon.
img.beach: Feuillage de palmier encadrant quelqu’un qui avance dans le lagon cristallin depuis une plage de sable blanc jusqu’aux îlots boisés.
img.boat: Vue aérienne d’un ensemble de villas sur pilotis au chaume, long ponton avec voiliers et annexes, grande piscine et colline couverte de jungle.
img.fitness: Baskets au tapis de course devant une large baie vitrée donnant sur une verdure tropicale.
img.group: Scène retro d’un banquet marin sur glace sous un toit de chaume, étal garni de fleurs dont hibiscus, une femme brandit fièrement une langouste parmi les convives en tenues lumineuses, tous très souriants.
img.restaurant: Grande terrasse en bois ombrée, palmier tout près, plage blonde et lagon turquoise jusqu’aux petites barques au loin.
img.show: Pause gourmande dans le lagon peu profond — parapluie orange, table quasi immergée, plateaux façonnés en feuilles de bananier et fruits frais avec relief volcanique à l’horizon.
img.sunset: Bord de lagon paisible se fondant dans du sable pâle sous des couches de nuages pastels dorés ou rosés comme au lever ou au coucher du soleil, lointaine presqu’île boisée et bateaux sur le récif.
img.table: Intérieur de restaurant tout en atmosphère au sol sablonneux avec comptoir en bois sculpté, tabourets en rondins, plafond à pointes de chaume, lanternes suspendues en fibres tressées et chandelles parmi verdure tropicale.
img.water: Vue sous la surface — silhouettes mains jointes de deux personnes en masque et tuba contre une eau turquoise striée par des rais lumineux.
img.welcome: Hall d’hôtel contemporain avec réception en bois clair, personnel souriant accueillant un couple près du décor sculptural et de fauteuils au contraste monochrome.
meta_description: "Flow par Bloody Mary's Hotel à Bora Bora : espaces fluides, textures insulaires et un rythme de séjour entre lagon, ciel et vie locale vibrante."
meta_keywords: "Bloody Mary's Hotel, Bora Bora, flow, boutique hotel, island hospitality, lagoon, French Polynesia, luxury stay"
og_description: "Discover Flow: a fluid way to stay in Bora Bora, inspired by island rhythms and contemporary elegance."
og_title: "Bloody Mary's Hotel - Bora Bora | Flow"
page_title: "Bloody Mary's Hotel - Bora Bora | Flow"
s1.p1: "Les espaces évoluent avec la lumière, les flots et le rythme du jour."
s1.p2: "Les chemins s'ouvrent vers le lagon. Les terrasses captent les nuances du ciel.<br>Les conversations circulent, d'un lieu à l'autre."
s1.sub: Ici, <span>aucun rythme</span> n'est imposé.<br>Vos journées. <span class="shape">Votre manière<br>de vivre Bora Bora</span>.
