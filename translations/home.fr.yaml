s1.btn: Créez votre histoire
s1.p1: "Inspiré du légendaire <b>Bloody Mary's Restaurant</b>, le <b>Bloody Mary's Hotel (53 clés)</b> propose une approche boutique et décontractée, alliant l'esprit vibrant de la tiki culture à un design contemporain élégant."
s1.p2: "L'expérience met l'accent sur la <b>convivialité</b>, <b>l'authenticité</b> et une <b>immersion</b> dans l'art de vivre polynésien."
s1.p3: "Entre terre et lagon, un lieu <b>unique...</b><br>Un <b>refuge</b> ouvert, inspiré, où se tissent des <b>rencontres</b> sincères, porté par une modernité douce et un sentiment profond d'appartenance à l'île.<br><br>Une autre manière de vivre Bora Bora... <b>vraie</b>, intensément <b>vivante</b>, profondément <b>humaine.</b>"
s1.sub.island: "...et l'île."
s1.sub.just_you: Juste vous
s1.sub.no_scripts: Sans codes. Sans clichés.
s1.sub.thanks_prefix: Merci de nous avoir
s1.sub.thanks: rejoints ici.
s1.subtitle_diff: Differently
s1.subtitle_lived: Lived
s1.title: Bora Bora
