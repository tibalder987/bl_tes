img.boat: Coucher de soleil spectaculaire sur des îlots et cocotiers en silhouette, rayons de soleil à travers les nuages sur le lagon.
img.fire_mob: Viande grillée sur de vives flammes, main du chef avec des pinces.
img.flow: Catamaran blanc sur une mer calme au coucher du soleil, rayons dorés à travers des nuages mauves.
img.flower_s1: Femme souriante en tenue polynésienne traditionnelle avec collier de fleurs blanches et couronne de feuilles.
img.flower_s7: Hibiscus rose contre-jouré par le soleil, feuillage tropical et toit de chaume en arrière-plan.
img.guitar: Musicien en chemise hawaïenne rouge jouant de la guitare acoustique Yamaha en extérieur.
img.orchestre: Photo promotionnelle dédicacée du groupe Chicago avec la mention To Bloody Mary's, 1999.
img.stay: Toits de fare polynésiens en chaume avec le mont Otemanu et les crêtes boisées sous un ciel bleu.
img.sunset: Cocotier en silhouette au coucher du soleil sur une eau tropicale calme, ciel rose et orange.
img.table: Intérieur du restaurant Bloody Mary's avec sol en sable, client au bar en bois et enseigne sculptée.
img.tiki: Tiki en bois sculpté de nuit avec enseigne Bloody Mary's et Since 1979 sur le socle en pierre.
img.water: Raies léopard nageant en groupe au-dessus d'un lagon turquoise limpide.
img.wild: Mont Otemanu et cocotiers à l'heure dorée au-dessus d'une forêt tropicale luxuriante, Bora Bora.
