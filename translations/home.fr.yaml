s2.title: Island
s3.btn: Installez-Vous
s3.p: "Des sanctuaires intimes, façonnés par les matières naturelles, la lumière, et les vues insulaires... imaginés pour les matins suspendus, les nuits qui s'étirent et les moments inattendus."
s3.title: "Séjourner"
s4.arrow: Entrez dans le rythme
s4.btn: À Table
s4.p: "Un écho contemporain à l'âme du Bloody Mary's Restaurant... une table et des cocktails qui invitent à prolonger l'instant, à connecter et à se sentir chez soi."
s4.title: Savourer
s5.btn: Suivez le Mouvement
s5.p: "Des espaces qui respirent au rythme de l'île... conçus pour onduler comme une musique, du rivage jusqu'au ciel."
s5.title: Vivre
s6.arrow: Laissez-vous porter
s6.btn: Restez
s6.p: "Un lieu où voyageurs, artistes et voix locales se mêlent… pour des moments qui se déploient naturellement."
s6.title: Être
s8.p1: "Vibrante de couleurs et de lumière, Bora Bora révèle sa véritable nature dans le pouls du quotidien... social, baigné de soleil, bercé par le lagon."
s8.p2: "Au Bloody Mary's Hotel, Bora Bora se vit avec <b>présence</b>. Non pas comme un décor, mais comme un lieu à habiter pleinement et à <b>ressentir.</b>"
