s1.title: A <span>Place</span> That's Always Been About <span>People.</span>
s1.p1: Since <b>1979</b>, the Bloody Mary's name has been woven into the everyday life of Bora Bora – a vibrant hub where dreams emerged, conversations sparked imagination, and people from all walks of life came together naturally.
s1.p2: No dress code. <span>No pretense.</span><br>Just long tables, shared meals, music and good laughs.
s1.p3: What mattered at Bloody Mary's Bora Bora wasn't where you came from – only that you were there.
s2.title: Where It <span>All Began</span>
s2.p1: Bloody Mary's began the way many island legends do – with a bold idea and someone adventurous enough to try it.
s2.p2: In the late 1970s, a flamboyant and charismatic Polish nobleman known locally as <b>Baron George von Dangel</b> arrived in Bora Bora carrying stories of a life that had taken him around the world – from aviation to cinema sets, from Australia to Tahiti.
s2.p3: Drawn by the island's beauty and spirit, he built a rustic restaurant from local materials – bamboo, coconut wood, pandanus thatch – and opened its doors in <b>1979.</b>
s2.p4: And so Bloody Mary's was born.
s2.p5: 'The concept was simple: fresh fish, cooked over coral stone grills, served in a place where travelers, artists, and locals could sit together at the same tables.'
s2.p6: Stories flowed as easily as the drinks.
s2.p7: And for those who found themselves wanting to stay longer, a few simple lagoon-side bungalows soon appeared nearby – an early sign that Bloody Mary's was always meant to be more than a place to eat.
s2bis.p1: Word traveled quickly, and before long Bloody Mary's had become part of Bora Bora's rhythm – growing alongside the island's only luxury address at the time, Hotel Bora Bora.
s2bis.p2: Hotel Bora Bora attracted well-known guests seeking privacy. But in the evening, many chose to step beyond the hotel…
s2bis.p3: For a change of scene.<br>For a more relaxed setting.<br>And to be closer to the <span>island</span> and its <span>people.</span>
s2bis.p4: Flashlights in hand, they would walk to Bloody Mary's Restaurant.
s2bis.p5: That's how the <span class="shape">legend began.</span>
s3.title: The <span>Turning Point</span>
s3.p1: Like many bold ventures, the early success came with challenges.
s3.p2: When Baron George's early venture ran into financial trouble, the future of Bloody Mary's seemed uncertain.
s3.p3: That is when <b>Dexter Hewett</b>, a Los Angeles entrepreneur who had fallen in love with Bora Bora, stepped in.
s3.p4: Dexter recognized something rare in Bloody Mary's – a place with a soul worth protecting.
s3.p5: In <b>1985</b>, he took the helm. Under his leadership, Bloody Mary's Restaurant grew into one of the most recognizable gathering places in Bora Bora.
s3.p6: 'Travelers arriving in Bora Bora were told there was one place they had to visit: a restaurant where the floor was sand, chairs were tree trunks, and lantern light flickered under a thatched roof.'
s4.title: From a Table<br>to a <span>Way of Life</span>
s4.p1: Word traveled far beyond Bora Bora's reef.
s4.p2: Celebrities, sailors, movie crews, and musicians all found their way there. Names like <b>Jimmy Buffett, Motley Crue, Chicago, Julio Iglesias, Marlon Brando, Quincy Jones, Pierce Brosnan, Harrison Ford, Jane Fonda</b> were among the many who walked across that sandy floor.
s4.p3: Over the years, Bloody Mary's Bora Bora continued to evolve with the island.
s4.p4: A dock extended over the lagoon, welcoming visiting yachts and expanding the restaurant's connection to the water.
s4.p5: The team grew, the reputation spread, and Bloody Mary's became the unmissable meeting point – social, unpretentious, deeply woven into the cultural life of Bora Bora.
s4.p6: Generations of staff, artists, and travelers left their mark on the place.
s4.p7: What began as a small, rustic restaurant became a <span class="shape">landmark</span> of island hospitality.
s4.p8: That spirit never left.
s5.title: Carrying the <span>Spirit Forward</span>
s5.p1: Bloody Mary's Hotel is not a random new project.
s5.p2: It is the continuation of a story rooted in Bora Bora and built over decades of <span>connection</span> with the island and its people.
s5.p3: Under local ownership carefully chosen by Dexter Hewett for their shared values and vision, the hotel carries the Bloody Mary's spirit forward while remaining true to its origins.
s5.p4: Openness, warmth, and a genuine sense of belonging now take shape in a new form – one that extends the experience beyond a single evening.
s5.rev.p1: The same lagoon.<br>The same view of iconic Mount Otemanu.<br>The same restaurant.<br>The same easy spirit of <span>hospitality</span>, now extended through the Bloody Mary's Hotel.
s5.rev.p2: 'A new chapter built on a simple idea:'
s5.rev.p3: That luxury isn't about distance or display, but about <span>genuine</span> <span class="shape">connection</span>, the rhythm of the island, and the <span>freedom</span> to simply be.
s6.title: A New Chapter,<br><span>Same Pulse</span>
s6.p1: Bloody Mary's has been defined by the people who brought it to life, and the generations of travelers who shared its stories across oceans.
s6.p2: And like the lagoon beside it, the story keeps moving forward.
s6.p3: Bloody Mary's Hotel opens in <b>Summer 2026</b>, carrying a legacy forward while leaving room for what comes next – shared moments, familiar faces, those discovering Bloody Mary's Bora Bora for the first time…
s6.p4: And the endless possibilities for dreams and new stories to unfold amidst the <span class="shape">tides and winds</span> of Bora Bora.
