hero.title: Avant <span class="shape">votre arrivée.</span>
hero.lead: "Quelques repères afin de planifier au mieux votre visite...<br>Pour que le voyage soit simple, et l'arrivée encore plus douce."
getting.title: Comment rejoindre la <span class="shape">Polynésie française ?</span>
getting.p1: La Polynésie française, plus poétiquement appelée <b>Tahit et ses Iles</b>, se trouve dans l'hémisphère sud, posée au cœur du Pacifique.
getting.p2: <b>L'aéroport international de Tahiti Faa'a</b> est la principale porte d'entrée vers la destination, et le seul point d'arrivée international de la destination.
getting.p3: "Quelques compagnies aériennes relient ce coin du monde au reste de la planète :"
getting.list_heading: Airlines
getting.li1: <b>Air Tahiti Nui</b>, notre compagnie nationale, avec des vols directs depuis Los Angeles, Paris, Auckland et, à partir de décembre 2026, Sydney
getting.li2: <b>Air France</b>, reliant Tahiti à Paris via Los Angeles
getting.li3: <b>United Airlines</b>, via San Francisco
getting.li4: <b>Hawaiian Airlines</b>, depuis Honolulu
getting.li5: <b>French Bee</b>, proposant une liaison entre Paris et Tahiti via San Francisco
getting.li6: <b>Aircalin</b>, depuis la Nouvelle-Calédonie
getting.li7: <b>Air New Zealand</b>, via Auckland
getting.cta: Chaque vol vous rapproche <span>un peu plus</span> de <span class="shape">Bora Bora.</span>
img.stay: Thatched Polynesian fare roofs with Mount Otemanu and forested peaks under a blue sky.
feel.title: Là où tout commence <span class="shape">à devenir réel...</span>
feel.p1: Depuis Tahiti, il faut compter environ <b>50 minutes de vol</b> pour rejoindre Bora Bora, avec des liaisons quotidiennes opérées par Air Tahiti et Air Moana.
feel.p2: Puis vient l'arrivée.
feel.p3: L'aéroport de Bora Bora se trouve sur un <b>motu</b>, un îlot posé au milieu du lagon et entouré de bleus irréels. On atterrit presque dans l'eau. Et à vrai dire, peu d'arrivées au monde offrent une telle sensation d'émerveillement.
feel.p4: A votre arrivée, après la récupération des bagages, notre équipe vous guidera vers la navette maritime qui traverse le lagon jusqu’à l’île principale (environ 15 minutes de trajet).
feel.p5: Une fois à Vaitape, le principal village de Bora Bora, un court trajet d’environ 10 minutes vous mènera jusqu’au Bloody Mary’s Hotel.
feel.p6_open: "Vous souhaitez organiser un transfert privé en bateau directement depuis l'aéroport jusqu'à l'hôtel ? Notre équipe Concierge s'en charge avec plaisir. Il vous suffit pour cela de nous écrire à : <a href='mailto:play@bloodymarys.com'><b>play@bloodymarys.com</b></a>"
feel.cta: Et ensuite, retirez les chaussures.<br>Posez vos valises.<br>Laissez le reste derrière vous.<br><span class="shape">Vous y êtes.</span>
qa.checkin.title: Check-in &amp; check-out
qa.checkin.p1: <b>Check-in</b> à partir de <b>15h00</b>
qa.checkin.p2: "<b>Check-out</b> à <b>11h00</b>"
qa.checkin.p3: Vous arrivez plus tôt ou repartez plus tard ?<br>Des chambres de transit sont disponibles pour une douche rafraîchissante, se changer, ou simplement ralentir le rythme entre deux trajets.
qa.checkin.p4: Nous ferons toujours de notre mieux pour vous accueillir dans les meilleures conditions, sous réserve de disponibilité le jour même. Rien ne peut être garanti à l’avance.
qa.checkin.p5: Surtout... <b>vous êtes à Bora Bora.</b><br>Prenez votre temps.
qa.checkin.p6: Installez-vous au bord de la piscine, glissez-vous dans le lagon, ou commencez simplement par un cocktail.<br>Tout se met doucement en place.
qa.currency.title: Quelle est la monnaie en Polynésie française ?
qa.currency.p1: La monnaie locale est le <b>Franc Pacifique (XPF).</b>
qa.currency.p2: "Il est rattaché à l’Euro selon un taux fixe : <b>1 EUR = 119,332 XPF</b>"
qa.currency.p3: "Les cartes bancaires sont largement acceptées, même si un peu d’espèces peut toujours être utile pour les petits arrêts en chemin."
qa.currency.p4: "Des distributeurs automatiques sont disponibles à Vaitape, le principal village de Bora Bora."
qa.currency.p5: "Un service de change est également disponible au Bloody Mary’s Hotel."
qa.weather.title: Quel temps fait-il à Bora Bora ?
qa.weather.p1: <b>Chaud, tropical,</b> et merveilleusement simple à vivre.
qa.weather.p2: Les températures oscillent généralement entre 24°C et 30°C, avec le soleil bien installé tout au long de l’année.
qa.weather.p3: De juin à septembre, l’air se fait plus léger, légèrement plus frais, avec moins d’humidité. C’est aussi la saison la plus prisée.
qa.weather.p4: Les averses peuvent apparaître puis disparaître rapidement, laissant derrière elles une île encore plus luxuriante et pleine de vie.
qa.weather.p5: "<strong>Petit conseil:</strong><br>Laissez les talons à la maison. Ils iraient rarement bien loin ici.<br>Privilégiez des chaussures plates et confortables pour flâner sur les pontons en bois, longer le lagon ou marcher sur le sol de sable du mythique Bloody Mary’s Restaurant."
qa.wifi.title: Et le wifi à Bora Bora ?
qa.wifi.p1: "Au Bloody Mary’s Hotel, tout est prévu : le wifi est inclus dans l’ensemble de la propriété."
qa.wifi.p2: Mais... c’est peut-être aussi le moment idéal pour poser le téléphone un instant et échanger le rythme digital contre le flow de l’île.
qa.wifi.p3: Vous prévoyez d’utiliser vos données mobiles pendant le voyage ?<br>Nous vous recommandons de vérifier votre forfait auprès de votre opérateur avant votre arrivée.<br>Le reste pourra attendre un peu.
qa.tipping.title: Et les pourboires à Bora Bora ?
qa.tipping.p1: En Polynésie française, le pourboire n’est pas une pratique habituelle et n’est jamais attendu.
qa.tipping.p2: Si vous souhaitez laisser quelque chose, cela reste bien entendu à votre entière discrétion.
qa.tipping.p3: Dans les hôtels et resorts, une charge de service est généralement incluse dans les factures. Cette contribution est ensuite partagée entre les équipes et redistribuée chaque année en reconnaissance de leur travail et de leur engagement.
qa.whattobring.title: Que glisser dans sa valise pour Bora Bora ?
qa.whattobring.p1: "Commencez par une bonne protection solaire, respectueuse de la vie marine si possible. Vous trouverez sur place plusieurs options éco-responsables, en pharmacie locale ou dans la boutique de l’hôtel<br>Le soleil sait se faire remarquer ici."
qa.whattobring.p2: "Ajoutez l’essentiel : lunettes de soleil, chapeau ou casquette, lycra anti-UV, chaussures d’eau, ainsi qu’un bon répulsif anti-moustiques.<br>Un sac de plage ou un petit sac à dos qui vous suivront souvent partout."
qa.whattobring.p3: Une veste légère ou un châle peut aussi être appréciable durant les mois plus frais, de juin à septembre.
qa.whattobring.p4: Gardez la valise légère.<br>On a besoin de peu ici. Et le voyage n’en est que plus simple.
qa.parking.title: Vous louez une voiture ?
qa.parking.p1: Si vous prévoyez de stationner un véhicule chez nous, un supplément de <b>2 000 XPF</b> (16,76 EUR) par jour sera ajouté à votre compte.
qa.languages.title: Quelles sont les langues officielles en Polynésie française ?
qa.languages.p1: Le français et le tahitien sont les langues officielles à Tahiti et ses Iles.<br>L’anglais est également largement parlé, notamment dans les zones touristiques et les hôtels.
qa.languages.p2: Les échanges se font simplement ici. Un sourire aide souvent encore davantage.
qa.electricity.title: Electricité
qa.electricity.p1: En Polynésie française, l’électricité fonctionne en <b>220V</b>, avec des prises de type européen utilisées sur l’ensemble du territoire.<br>Nous vous recommandons de prévoir un adaptateur si nécessaire.
qa.electricity.p2: Au Bloody Mary’s Hotel, des prises <b>110V</b> sont également disponibles dans la salle de bain, principalement pour les rasoirs.
qa.water.title: L’eau du robinet est-elle potable à Bora Bora ?
qa.water.p1: Oui, l’eau du robinet est potable à Bora Bora.
qa.water.p2: Des fontaines à eau sont disponibles dans l’ensemble de l’hôtel, vous permettant de remplir votre gourde au fil de la journée.
qa.water.p3: Si vous le préférez, de l’eau minérale en bouteille reste bien sûr toujours disponible.
qa.water.p4: Sous ce soleil, mieux vaut penser à bien s’hydrater.
qa.forget.title: Aurions-nous oublié quelque chose ?
qa.forget.p1: Si un détail nous a échappé, n’hésitez pas à nous écrire. Nous ne sommes jamais bien loin.
qa.forget.p2: 'Pour les demandes générales : <a href="mailto:play@bloodymarys.com">play@bloodymarys.com</a>'
