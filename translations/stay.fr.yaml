room.motu.p1: Les Motu View Bungalows invitent à vivre entre deux éléments, entre ancrage et mouvement.
room.motu.p2: Depuis la terrasse, le regard s'étire vers le lagon, le motu principal de l'hôtel et les montagnes... une ligne d'horizon où les reliefs verdoyants rencontrent les nuances du bleu.
room.motu.title: Motu View Rooms
