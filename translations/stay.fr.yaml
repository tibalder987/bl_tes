img.sea: Pic rocheux du mont Otemanu au-dessus d'une forêt dense, cocotier au premier plan et toits de fare en chaume.
img.sunset: Bungalows sur pilotis à l'heure dorée avec une montagne verdoyante et lagon miroitant.
img.sunset_big: Lumière du couchant sur les villas sur pilotis et la montagne en silhouette, feuillage tropical au premier plan.
