room.otemanu.h5: Au Coeur
room.otemanu.li1: 3 Personnes
room.otemanu.p1: Le mythique Mont Otemanu devient le décor vivant de vos journées... un espace où l'on oscille librement entre repos et mouvement, entre silence et élan.
room.otemanu.p2: Depuis la terrasse privée, la montagne se révèle au fil de la lumière, changeante, presque vivante…
room.otemanu.title: Otemanu View Bungalows
