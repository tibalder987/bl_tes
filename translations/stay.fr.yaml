room.panoramic.p1: Nichées à flanc de montagne, les Panoramic View Rooms et les Penthouse Suites invitent à une simplicité insulaire, naturelle et apaisante.
room.panoramic.p2: Natural textures, open light, and wide island views create a calm place to pause - and meet the island with simplicity.
room.panoramic.title: "Panoramic View Rooms<br>& Penthouse Suites"
room.sunset.btn: Suivre le Soleil
room.sunset.h5: Au Couchant
room.sunset.li1: 3 Personnes
room.sunset.p1: Entrez dans le rythme de l'île avec nos Sunset View Suites.
room.sunset.p2: Lorsque la lumière se fait dorée et glisse sur l'eau et le ciel, les soirées s'ouvrent en douceur, comme une promesse silencieuse de ce que le lendemain portera.
room.sunset.p3: Laissez vos rêves se déposer dans la nuit… et vous emporter doucement au fil de l'obscurité.
room.sunset.title: Sunset View Suites
s1.btn: Réserver mon Séjour
s1.p1: Au Bloody Mary's Hotel, chaque séjour commence par une vue... sur le lagon, la montagne, ou peut-être bien les deux.
s1.p2: Des intérieurs confortables, des couleurs qui célèbrent l'esprit festif de Bloody Mary's, et des espaces ouverts qui invitent à trouver votre propre rythme… ou à vous laisser porter par celui de l'île.
s1.sub: Ici, Bora Bora se vit à
