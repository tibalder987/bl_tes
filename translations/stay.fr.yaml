room.horizon.p1: Vivez le “blue mind” avec nos Horizon View Bungalows.<br>Entre ciel et lagon, le regard se perd à l'infini. Le temps s'étire, les repères s'effacent… et les journées s'écoulent librement, au rythme des éléments.
