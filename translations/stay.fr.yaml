s4.btn: Faire son Nid
s4.p1: "Toutes les chambres, bungalows et suites du Bloody Mary's Hotel disposent d'un lit king-size, d'un espace extérieur privé, ainsi que d'une sélection d'équipements <b>pensés pour le confort et la simplicité du séjour.</b>"
s4.p2: "Dans un souci de bien-être et de qualité de l'air pour tous, l'ensemble des hébergements est <b>non-fumeur.</b>"
