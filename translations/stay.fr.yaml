img.flower: Cocotier en silhouette au crépuscule au-dessus d'une eau calme, ciel doux orange et bleu.
img.horizon: Bungalow sur pilotis au toit de chaume au-dessus d'un lagon turquoise, île verdoyante et ciel bleu.
img.horizon_big: Vue large d'un bungalow sur pilotis au-dessus d'un lagon lumineux vers une crête boisée.
img.hotel: Chambre de suite hôtelière lumineuse avec lit king, tête de lit en bois clair, plafond en poutres et accents turquoise tropicaux.
img.hotel_mob: Intérieur de chambre de suite avec linge blanc, bois et textiles à motifs tropicaux bleus-verts.
img.meet: Vue depuis des marches en bois au-dessus d'un lagon turquoise limpide vers une côte bordée de cocotiers.
img.motu: Crépuscule sur des bungalows sur pilotis en silhouette, lagon calme, ciel violet et doré.
img.motu_big: Panoramique du soir sur des villas sur pilotis reflétées dans le lagon sous un coucher de soleil nuageux.
