s3.p: "Intimate sanctuaries shaped by natural textures, light, and island views - designed for slow mornings, late nights, and the moments you did not plan."
s3.title: Stay
s4.arrow: Follow the rhythm
s4.btn: At the table
s4.p: "A modern echo to Bloody Mary's Restaurant legacy - food and drinks as an invitation to linger, connect, and feel at home."
s4.title: Dine
s5.btn: In motion
s5.p: "Architecture and spaces that breathe with the island - designed to move like music from shore to sky."
s5.title: Flow
s6.arrow: Follow the wind
s6.btn: Stay for a while
s6.p: "A place where guests, local voices, and the island meet as one - for moments that unfold naturally."
s6.title: Be
s8.p1: "A vibrant tapestry of color and light, Bora Bora reveals its true character in the everyday rhythm of island life - social, sun-warmed, lagoon-lulled."
s8.p2: "Here, life unfolds between mountain and ocean - from early swims to lively conversations and afternoons drifting into sunset tones."
s8.p3: "At <b>Bloody Mary's Hotel,</b> Bora Bora is experienced with presence - not just as a backdrop, but as a place to step fully in and <b>feel.</b>"
