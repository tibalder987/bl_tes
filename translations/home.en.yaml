s1.arrow_flow: Follow the flow
s1.btn: step into the story
s1.p1: 'Inspired by the legendary <b>Bloody Mary''s Restaurant</b> - whose name it proudly carries - <b>the 53-key boutique Bloody Mary''s Hotel</b> blends the vivid, playful energy of "tiki culture" with an effortless, contemporary elegance, shaping a kind of luxury that feels <b>grounded, social, and deeply connected.</b>'
s1.p2: "A lively meeting point between land and sea - intimate yet open to the world - it emerges as an inclusive and inspiring haven where <b>genuine encounters</b>, gentle modernity, and a deep <b>sense of belonging</b> to the island are celebrated. "
s1.p3: "Bloody Mary's Hotel reveals a fresh way to experience Bora Bora - <b>authentic</b>, unapologetically <b>alive</b> and <b>human</b> at its core."
s1.sub.island: and the island, as it is.
s1.sub.just_you: Just you
s1.sub.no_scripts: No scripts. No clichés.
