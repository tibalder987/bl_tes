s1.p1: "Since <b>1979</b>, the legendary Bloody Mary's Restaurant has been a gathering place in Bora Bora."
s1.p2: "Over decades, locals, travelers, artists have come together around shared tables, the fresh catch of the day, and <b>lively evenings.</b>"
s1.p3: Today, that same spirit extends across the Bloody Mary's Hotel, with each place offering its own way to meet, linger, and enjoy the moment.
s1.sub: Sparking imagination. Real life images
s1.sub_span: coming soon.
s1.title: Sharing is
s1.title_span: Caring
s2.btn: Make it a celebration
s2.p1: "The iconic Bloody Mary's Restaurant remains <b>at the heart of it all.</b>"
s2.p2: "Sandy floors, thatched roof, wooden tables and seats, fresh fish on display. The unmissable Bora Bora experience is as it has always been: simple, alive, and open to everyone."
s2.p3: "You choose your catch.<br>Our Chef prepares it for you.<br>And before you know, drinks and conversations flow into the night."
s2.title: Bloody Mary's Restaurant
s2.title_br: The Original
s3.btn: Join us
s3.p1: Set above the lagoon, Povai Bay Bistro brings a lighter, more contemporary experience.
s3.p2: "In the morning, breakfast is served to the rhythm of the water.<br><br>At dinner time, French influences meet island ingredients for unexpected interpretations."
s3.sub1: Come for the unhurried pace.
s3.sub_span: Stay for the view.
s3.title: Povai Bay Bistro
s3.title_span: On the Water
s4.btn: Find your table
s4.p1: Just a short drive from the hotel - with a complimentary shuttle - La Bella Matira offers another way to experience the Bloody Mary's spirit
s4.p2: Set along Matira Beach, it's a place for sunlit lunches, easy afternoons, barefoot evenings, and time spent close to the water.
s4.p3: Mediterranean flavors meet the energy of Bora Bora - fresh, vibrant, and best enjoyed together, somewhere between the table and the water.
s4.title: La Bella Matira
s4.title_span: A Different Horizon
s6.p1: "The sweet spot for nibbles and punchy cocktails as the day shifts.<br>A place where the view takes on new meanings as the light softens."
s6.p2: Amidst Bora Bora's gentle flow, find your own.
