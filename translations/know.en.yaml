hero.title: Before <span class="shape">you arrive.</span>
hero.lead: A few things to know before you get here&hellip; so the journey feels easy, and the arrival even better.
getting.title: How to get to <span class="shape">French Polynesia ?</span>
getting.p1: French Polynesia &ndash; more poetically called <b>The Islands of Tahiti</b> &ndash; is located in the southern hemisphere.
getting.p2: <b>Tahiti Faa&rsquo;a International Airport</b> is the main gateway to The Islands of Tahiti &ndash; the only international point of entry to the destination.
getting.p3: "A handful of airlines connect this stretch of the Pacific to the rest of the world&nbsp;:"
getting.list_heading: Airlines
getting.li1: <b>Air Tahiti Nui</b>, the national carrier, with direct routes to Los Angeles, Paris, Auckland &ndash; and from December&nbsp;2026, Sydney
getting.li2: <b>Air France</b>, connecting Tahiti to Paris via Los Angeles
getting.li3: <b>United Airlines</b>, via San Francisco
getting.li4: <b>Hawaiian Airlines</b>, from Honolulu
getting.li5: <b>French Bee</b>, offering low-cost service between Paris and Tahiti via San Francisco
getting.li6: <b>Aircalin</b>, from New Caledonia
getting.li7: <b>Air New Zealand</b>, via Auckland
getting.cta: Each one brings you <span>just a little closer</span> to <span class="shape">Bora Bora.</span>
img.stay: Thatched Polynesian fare roofs with Mount Otemanu and forested peaks under a blue sky.
feel.title: Where it starts <span class="shape">to feel real&hellip;</span>
feel.p1: From Tahiti, it is a <b>50-minute flight</b> to Bora Bora, with Air Tahiti and Air Moana operating daily connections.
feel.p2: And then, the arrival.
feel.p3: Bora Bora&rsquo;s airport is set on a <b>motu</b> &ndash; islet &ndash; surrounded by the lagoon&rsquo;s shifting blues. You land right into it. And truly, this is the most breathtaking arrival in the world.
feel.p4: Once you arrive, after luggage collection, our team will guide you to the shuttle boat across the lagoon to the main island (15-minute boat transfer).
feel.p5: Upon arrival in Vaitape, Bora Bora&rsquo;s main town, a short 10-minute drive brings you to Bloody Mary&rsquo;s Hotel.
feel.p6_open: 'Looking to arrange a private boat transfer directly from the airport to the hotel&nbsp;?<br>Our concierge can take care of it. Simply reach out at&nbsp;: <a href="mailto:play@bloodymarys.com"><b>play@bloodymarys.com</b></a>'
feel.cta: Drop your shoes, your bags.<br>Leave everything behind.<br><span class="shape">You are here.</span>
qa.checkin.title: Check-in &amp; check-out
qa.checkin.p1: <b>Check-in</b> time is <b>3:00pm</b>
qa.checkin.p2: "<b>Check-out</b> time: <b>11:00am</b>"
qa.checkin.p3: Arriving early or leaving later? Transit rooms are available for a quick shower and a change of pace.
qa.checkin.p4: We will always do our best to accommodate &ndash; though availability can&rsquo;t be guaranteed in advance.
qa.checkin.p5: And remember&hellip; <b>you are in Bora Bora.</b><br>Take your time.
qa.checkin.p6: Find a spot by the pool, step into the lagoon, or start with a cocktail.<br>It&rsquo;s all falling into place.
qa.currency.title: What is the currency in French Polynesia?
qa.currency.p1: The local currency is the <b>French Pacific Franc (XPF).</b>
qa.currency.p2: It is linked to the Euro at a fixed rate of 1&nbsp;EUR = 119.332&nbsp;XPF.
qa.currency.p3: Credit cards are widely accepted, though a little cash can be useful for small stops along the way.
qa.currency.p4: ATMs are available in the main town of Vaitape.
qa.currency.p5: Currency exchange is available at the Bloody Mary&rsquo;s Hotel.
qa.weather.title: What is the weather like in Bora Bora?
qa.weather.p1: <b>Warm, tropical,</b> and easy to dress for.
qa.weather.p2: Expect temperatures between 24&deg;C (75&deg;F) and 30&deg;C (86&deg;F), with plenty of sun throughout the year.
qa.weather.p3: From June to September, the air feels lighter, slightly cooler, with less humidity. It&rsquo;s also peak season.
qa.weather.p4: Rain showers may come and go &ndash; often briefly &ndash; keeping the island lush, green, and very much alive.
qa.weather.p5: "<strong>PS:</strong> Leave the heels at home, they won&rsquo;t go far here&hellip; you&rsquo;ll mostly want flat, comfortable shoes to stroll along wooden decks or across the sand floor of the iconic Bloody Mary&rsquo;s Restaurant."
qa.wifi.title: What is the wifi situation in Bora Bora?
qa.wifi.p1: At Bloody Mary&rsquo;s Hotel, we have you covered. Wifi is included throughout the property.
qa.wifi.p2: But consider this&hellip; maybe it is time to put the phone down and trade the digital pace for island flow.
qa.wifi.p3: Planning to use your mobile data while traveling?<br>Check with your provider before you arrive.
qa.tipping.title: What about tipping in Bora Bora?
qa.tipping.p1: Tipping is not customary in French Polynesia and is never expected.
qa.tipping.p2: If you choose to leave something, it is entirely at your discretion.
qa.tipping.p3: A service charge is included in hotels&rsquo; and resorts&rsquo; bills. This contribution is shared among the team and distributed annually as a bonus for their work and dedication.
qa.whattobring.title: What to bring for a stay in Bora Bora?
qa.whattobring.p1: "Start with good sun protection, reef-safe, if you can. You will find plenty of eco-conscious options once you&rsquo;re here, in local pharmacies or our onsite boutique.<br>The sun can be strong. You&rsquo;ll notice."
qa.whattobring.p2: "Add the essentials: sunglasses, a hat or cap, a swim shirt, reef shoes, and a reliable mosquito repellent. A beach bag or light backpack tends to follow you everywhere."
qa.whattobring.p3: A light jacket or shawl can come in handy in the cooler months, from June to September.
qa.whattobring.p4: Keep the suitcase light.<br>You won&rsquo;t need much here. And it makes the journey that much easier.
qa.parking.title: Parking a car with us?
qa.parking.p1: A small fee of 2000&nbsp;XPF (16.76&nbsp;EUR) per day will be charged to your account.
qa.languages.title: What about languages in The Islands of Tahiti?
qa.languages.p1: French and Tahitian are the official languages of the Islands of Tahiti.
qa.languages.p2: English is widely spoken. Conversations tend to come easy here.
qa.electricity.title: Electricity
qa.electricity.p1: Electricity in French Polynesia is <b>220V</b>, with <b>European-style plugs</b> used throughout. We recommend bringing an adapter if needed.
qa.electricity.p2: At Bloody Mary&rsquo;s Hotel, <b>110V outlets</b> are also available in the bathroom, mainly for razors.
qa.water.title: Is tap water drinkable in Bora Bora?
qa.water.p1: Yes, tap water is safe to drink in Bora Bora.
qa.water.p2: Water fountains are available throughout the resort, so bring your bottle and refill as you go.
qa.water.p3: If you feel like it, bottled mineral water is always within reach.
qa.water.p4: It&rsquo;s important to stay hydrated.
qa.forget.title: Did we forget something?
qa.forget.p1: If something slipped through, just reach out &ndash; we&rsquo;re never far.
