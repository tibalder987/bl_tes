s1.title: <span>Ici</span>, tout a toujours été une histoire de <span>rencontres</span>
s1.p1: "Depuis <b>1979</b>, le nom Bloody Mary's s'est inscrit dans le quotidien de Bora Bora... Un espace vivant où naissent les rêves, où les conversations nourrissent l'imaginaire, et où les visiteurs de tous horizons se retrouvent avec simplicité..."
s1.p2: Pas de code vestimentaire. <span>Sans prétention. </span><br>Juste de longues tables, des repas partagés, de la musique et des éclats de rire.
s1.p3: Au Bloody Mary's Bora Bora, peu importait d'où on venait. L'essentiel était d'être là.
s2.title: Là où Tout a <span>Commencé</span>
s2.p1: "Bloody Mary's Bora Bora est né comme naissent de nombreuses légendes insulaires. D'une idée audacieuse, portée par quelqu'un d'assez fou pour la matérialiser."
s2.p2: "A la fin des années 1970, un polonais flamboyant et charismatique, connu localement sous le nom de <b>Baron George von Dangel</b>, arrive à Bora Bora, riche de voyages et d'aventures aux quatre coins du monde, de l'aviation aux plateaux de cinéma, de l'Australie à Tahiti."
s2.p3: "Séduit par la beauté et l'énergie de l'île, il imagine un restaurant simple, construit à partir de matériaux locaux (bambou, bois de cocotier, toit en pandanus) et ouvre ses portes en <b>1979.</b>"
s2.p4: "Ainsi naît le restaurant Bloody Mary's."
s2.p5: "Le concept est simple : du poisson frais, grillé sur pierre de corail, servi dans un lieu où voyageurs, artistes et habitants se retrouvent autour des mêmes tables."
s2.p6: "Les histoires circulent aussi librement que les verres se remplissent."
s2.p7: "Et pour ceux qui ne veulent pas repartir, quelques bungalows, posés au bord du lagon, voient bientôt le jour, comme un premier signe que Bloody Mary's n'a jamais été seulement un restaurant.<br><br>La rumeur se répand vite."
s2bis.p1: "Et cette adresse s'inscrit rapidement dans le rythme de Bora Bora, grandissant aux côtés du seul hôtel de luxe de l'époque, l'Hôtel Bora Bora."
s2bis.p2: "L'hôtel accueille alors des visiteurs en quête de discrétion. Mais le soir venu, beaucoup choisissent de sortir..."
s2bis.p3: Pour changer d'atmosphère.<br>Pour retrouver quelque chose de plus simple...<br>De plus vrai.
s2bis.p4: "Lampe torche à la main, ils rejoignaient le Bloody Mary's Restaurant à pied."
s2bis.p5: C'est ainsi que la <span class="shape">légende a commencé</span>
s3.title: Le <span>Tournant</span>
s3.p1: Comme toute aventure audacieuse, les débuts connaissent leurs défis.
s3.p2: Lorsque le projet initial de Baron George rencontre des difficultés financières, l'avenir du Bloody Mary's devient incertain.
s3.p3: C'est alors que <b>Dexter Hewett</b>, entrepreneur de Los Angeles et tombé sous le charme de Bora Bora, entre en scène.
s3.p4: "Il perçoit immédiatement ce qui rend ce lieu unique: une âme, rare, qu'il faut préserver."
s3.p5: En <b>1985</b>, il reprend les rênes.<br>Sous son impulsion, le Bloody Mary's Restaurant devient l'un des lieux de rencontre les plus emblématiques de Bora Bora.
s3.p6: "Très vite, le restaurant prend une nouvelle dimension et s'impose comme le symbole de l'esprit convivial de l'île auprès des voyageurs: il existe un endroit où il faut absolument aller. Un restaurant où le sol est de sable, où les sièges sont taillés dans des troncs d'arbres, et où la lumière des torches danse sous un toit de palmes."
s4.title: D'une Table<br>à un <span>Art de Vivre</span>
s4.p1: "Très vite, sa réputation dépasse le récif de Bora Bora."
s4.p2: "Célébrités, marins, équipes de tournage, musiciens... tous finissent par y faire un passage. Des noms comme <b>Jimmy Buffett, Mötley Crüe, Chicago, Julio Iglesias, Marlon Brando, Quincy Jones, Pierce Brosnan, Harrison Ford, Jane Fonda</b> comptent parmi ceux qui ont foulé ce sol de sable."
s4.p3: Au fil des années, Bloody Mary's Bora Bora évolue avec l'île.
s4.p4: Un ponton s'avance sur le lagon, accueillant les yachts de passage et ouvrant encore davantage le lieu sur l'eau.
s4.p5: L'équipe s'agrandit. La réputation grandit.<br>Et Bloody Mary's devient ce point de rendez-vous incontournable. Social, sans prétention, profondément ancré dans la vie de l'île.
s4.p6: Générations après générations, équipes, artistes et voyageurs y laissent leur empreinte.
s4.p7: Ce qui avait commencé comme un simple restaurant, rustique et sincère, devient une <span class="shape">véritable icône</span> de l'hospitalité polynésienne.
s4.p8: Et cet esprit... n'a jamais quitté les lieux.
s5.title: Prolonger un <span>Héritage Précieux</span>
s5.p1: "Le <b>Bloody Mary's Hotel</b> n'est pas un projet anodin."
s5.p2: "Il est la continuité d'une histoire profondément ancrée à Bora Bora, <span>tissée</span> au fil des décennies avec l'île et ceux qui y vivent."
s5.p3: "Aujourd'hui porté par des investisseurs locaux, choisis avec soin par <b>Dexter Hewett</b> pour leurs valeurs et vision alignées, l'hôtel fait vivre l'esprit Bloody Mary's Bora Bora tout en restant fidèle à ses origines."
s5.p4: "Ouverture, chaleur, sentiment d'appartenance...<br>Tout cela prend une nouvelle forme, prolongeant l'expérience bien au-delà d'une simple soirée."
s5.rev.p1: Le même lagon.<br>La même vue sur le mythique <b>Mont Otemanu.</b><br>Le même restaurant.<br>Et ce même esprit d'<span>hospitalité</span>, libre et sincère, désormais déployé à travers le <b>Bloody Mary's Hotel.</b>
s5.rev.p2: "Un nouveau chapitre, ancré dans une idée simple :"
s5.rev.p3: le luxe ne réside ni dans la distance ni dans l'apparat, mais dans la <span>sincérité des liens</span>, le rythme de l'île... et la <span>liberté</span> d'être, tout simplement.
s6.title: Un Nouveau Chapitre,<br><span>La Même Energie</span>
s6.p1: "Depuis toujours, Bloody Mary's Bora Bora se définit par celles et ceux qui lui ont donné vie, et par les générations de voyageurs qui ont emporté ses histoires bien au-delà des océans."
s6.p2: "Et comme le lagon qui l'entoure, cette histoire continue d'avancer."
s6.p3: "Le Bloody Mary's Hotel accueillera ses premiers visiteurs à partir de <b>septembre 2026</b>, ouvrant cet héritage vers l'avenir tout en laissant place à ce qui reste à écrire... les moments partagés, les visages familiers, et ceux qui découvrent Bloody Mary's Bora Bora pour la première fois..."
s6.p4: ... et toutes les histoires à venir, dans l'écho des <span class="shape">flots et des vents</span> de Bora Bora.
